name: Nuget Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIG: 'Release'
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # SQL Server for the tracking integration tests (PNFT_SQLSERVER_CONNECTION). Test-only values, never real.
    # Service env and options cannot read the workflow env context, so the password is a literal here.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'PnftTest-only1!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'PnftTest-only1!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: NPM install
        run: npm ci
        working-directory: src/code/Umbraco.Community.PageNotFoundTracker.BackOffice.Client

      - name: NPM build
        run: npm run build
        working-directory: src/code/Umbraco.Community.PageNotFoundTracker.BackOffice.Client

      - name: Restore
        run: dotnet restore
        working-directory: src/

      - name: Build
        run: dotnet build -c ${{ env.BUILD_CONFIG }} --no-restore
        working-directory: src/

      # Fails when the SQLite and SQL Server migration sets do not cover the model (restores dotnet-ef itself).
      - name: Check pending model changes
        run: ./scripts/check-pending-model-changes.ps1

      - name: Test
        run: dotnet test -c ${{ env.BUILD_CONFIG }} --no-restore --no-build /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
        working-directory: src/
        env:
          PNFT_SQLSERVER_CONNECTION: 'Server=localhost,1433;User Id=sa;Password=PnftTest-only1!;TrustServerCertificate=True'
          PNFT_REQUIRE_SQLSERVER: 'true'

      # No --no-build: pack at solution level fails with NETSDK1085 (a referenced project invokes Build).
      # The earlier Release build makes this an incremental no-op rebuild; the client build still runs first.
      - name: Pack
        run: dotnet pack -c ${{ env.BUILD_CONFIG }} --no-restore --output ${{ env.NuGetDirectory }}
        working-directory: src/

      - name: Check package content
        run: ./.github/scripts/check-package.ps1 -PackageDirectory "${{ env.NuGetDirectory }}"

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 30
          path: ${{ env.NuGetDirectory }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
